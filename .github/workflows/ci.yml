name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks on ${{ matrix.os }} (Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 24
          - os: macos-26-intel
            node: 24
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Check package contents
        run: npm pack --dry-run

  integration:
    name: Lumine integration specs on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26-intel, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      LUMINE_JASMINE_REPORTER: list
    steps:
      - uses: actions/checkout@v7
        with:
          path: graviss
      - uses: actions/checkout@v7
        with:
          repository: lumine-code/lumine
          path: lumine
      - uses: actions/setup-node@v7
        with:
          node-version-file: lumine/.nvmrc
          cache: npm
          cache-dependency-path: lumine/package-lock.json
      - name: Install Linux build and headless-display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update || true
          sudo apt-get install -y xvfb libx11-dev libxkbfile-dev libsecret-1-dev
      - name: Use HTTPS for GitHub git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Install package dependencies
        working-directory: graviss
        run: npm ci --ignore-scripts
      - name: Install editor dependencies
        working-directory: lumine
        run: |
          install() { npm ci --ignore-scripts; }
          install || install || install
      - name: Download the Electron binary
        working-directory: lumine
        run: node ./node_modules/electron/install.js
      - name: Rebuild native modules for Electron
        working-directory: lumine
        run: npm run build
      - name: Prepare the macOS software Vulkan loader
        if: runner.os == 'macOS'
        working-directory: lumine
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ANALYTICS: "1"
        run: |
          node -p "'Electron ' + require('./node_modules/electron/package.json').version"
          find node_modules/electron/dist/Electron.app/Contents/Frameworks -iname '*vulkan*' -print
          file -L "node_modules/electron/dist/Electron.app/Contents/Frameworks/Electron Framework.framework/Versions/A/Electron Framework"
          brew install vulkan-loader
          loader_dir="$(brew --prefix vulkan-loader)/lib"
          file -L "$loader_dir/libvulkan.dylib"
          printf 'GRAVISS_VULKAN_LIBRARY_DIR=%s\n' "$loader_dir" >> "$GITHUB_ENV"
      - name: Run the Jasmine spec suite
        working-directory: lumine
        timeout-minutes: 20
        run: |
          export LUMINE_HOME="$RUNNER_TEMP/graviss-home"
          export TEMP="$RUNNER_TEMP/graviss-temp"
          export TMP="$TEMP"
          export TMPDIR="$TEMP"
          mkdir -p "$LUMINE_HOME" "$TEMP"
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run --auto-servernum npm start -- --test ../graviss/spec
          elif [ "$RUNNER_OS" = macOS ]; then
            # The headless Intel runner exposes no usable hardware GL device.
            # ANGLE loads Vulkan dynamically; keep the CI loader external to
            # the unmodified Electron dependency, then use its software driver.
            export DYLD_LIBRARY_PATH="$GRAVISS_VULKAN_LIBRARY_DIR${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
            export DYLD_FALLBACK_LIBRARY_PATH="$GRAVISS_VULKAN_LIBRARY_DIR${DYLD_FALLBACK_LIBRARY_PATH:+:$DYLD_FALLBACK_LIBRARY_PATH}"
            node -e "if (!process.env.DYLD_LIBRARY_PATH.includes(process.env.GRAVISS_VULKAN_LIBRARY_DIR)) throw new Error('The owned Vulkan loader path was not preserved'); console.log('Vulkan loader path:', process.env.DYLD_LIBRARY_PATH)"
            # Invoke Node explicitly so npm's protected system-shell hop cannot
            # purge the loader variables before the Electron CLI spawns it.
            node ./node_modules/electron/cli.js --no-sandbox --enable-logging . -f --dev --use-gl=angle --use-angle=swiftshader --test ../graviss/spec
          else
            npm start -- --test ../graviss/spec
          fi
